name: Feature request
description: Suggest a new capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please note: the MCP tool surface (`rlaif_info`, `rlaif_log`, `rlaif`) is deliberately minimal and will not grow without a strong safety case. New CLI subcommands and improvements to the safety layer are much more likely to land. Please see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the reasoning.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that rlaif doesn't support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine this working? A CLI sketch or config snippet is welcome.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this touch?
      options:
        - CLI subcommand
        - safety layer (caps, bucket, ops log, consent gate)
        - config file format
        - MCP tool (please justify)
        - docs only
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
