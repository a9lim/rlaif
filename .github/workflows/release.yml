name: Release

on:
  push:
    branches: [main]

# Single in-flight release at a time. If two version bumps land back to
# back the second waits for the first rather than racing to the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write     # tag + GH release
      id-token: write     # PyPI Trusted Publishing (OIDC) + sigstore
      attestations: write # PEP 740 attestations
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version from src/rlaif/__init__.py
        # Source of truth for the version is ``__version__`` in
        # src/rlaif/__init__.py; pyproject.toml resolves it dynamically via
        # hatchling. Parse the literal directly here rather than installing
        # the package just to read it.
        id: ver
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          text = pathlib.Path("src/rlaif/__init__.py").read_text()
          m = re.search(r'^__version__ = "([^"]+)"', text, re.M)
          if m is None:
              raise SystemExit("src/rlaif/__init__.py has no __version__")
          print(f"version={m.group(1)}")
          PY

      - name: Check if tag already exists
        id: check
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Pre-publish safety gate
        # rlaif fires a real shock at runtime; the build artifact going to
        # PyPI must pass the safety dry-run end-to-end before it is
        # released to users. CI on main has already verified this on the
        # source tree, but installing the wheel and re-running dry-run
        # catches packaging regressions (missing files, broken entry
        # point) that wouldn't be caught any other way.
        if: steps.check.outputs.exists == 'false'
        run: |
          pip install dist/rlaif_mcp-*.whl
          rlaif --version
          rlaif dry-run

      - name: Create tag
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish to PyPI
        if: steps.check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PEP 740: PyPI shows a verified-publisher badge when the
          # uploaded artifact is signed by GitHub's OIDC identity. The
          # workflow already has id-token: write for Trusted Publishing,
          # so this is essentially free hardening.
          attestations: true

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes dist/*
