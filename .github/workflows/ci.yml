name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PY_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install "$PY_VERSION"

      - name: Sync dependencies
        run: uv sync --extra dev --python "$PY_VERSION"

      - name: Pyright (strict on src/rlaif)
        run: uv run pyright src/rlaif/

      - name: Pytest
        run: uv run pytest

      - name: Dry-run safety invariants
        run: uv run rlaif dry-run
