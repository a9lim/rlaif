name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --extra dev --python 3.12
      - name: Pyright (strict on src/rlaif)
        run: uv run pyright src/rlaif/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # Cross-platform smoke: rlaif's README documents Windows-specific
        # config-path behavior and macOS is the primary dev target. Run the
        # full suite on the canonical Python (3.12) for those platforms so
        # path / line-ending regressions surface in CI rather than at
        # `rlaif init` time.
        include:
          - os: macos-latest
            python-version: "3.12"
    env:
      PY_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install "$PY_VERSION"

      - name: Sync dependencies
        run: uv sync --extra dev --python "$PY_VERSION"

      - name: Pytest
        run: uv run pytest

      - name: Dry-run safety invariants
        run: uv run rlaif dry-run

  build:
    # Validates the dynamic-version setup, sdist completeness, wheel
    # metadata (twine check), and that the published artifact actually
    # works end-to-end: install → console script runs → safety dry-run
    # passes. If this is green the release workflow can publish blind.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: pip install dist/rlaif-*.whl

      - name: Verify console script and version round-trip
        run: |
          python - <<'PY'
          import importlib.metadata
          import rlaif
          installed = importlib.metadata.version("rlaif")
          if installed != rlaif.__version__:
              raise SystemExit(
                  f"dynamic version mismatch: installed={installed}, "
                  f"__version__={rlaif.__version__}"
              )
          print(f"OK: rlaif {installed}")
          PY
          rlaif --version

      - name: Safety dry-run against the installed wheel
        # Belt-and-suspenders: the test job already ran dry-run against
        # the source tree; this re-runs it against the actual artifact
        # going to PyPI, catching packaging regressions where the wheel
        # is missing files needed by the safety layer.
        run: rlaif dry-run

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
