name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (version in the trailing comment);
# dependabot bumps both together.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # --locked fails if uv.lock has drifted from pyproject.toml.
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev --python 3.12
      - name: Pyright (strict on src/rlaif)
        run: uv run --locked pyright src/rlaif/

  tests:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}

      - name: Pytest
        run: uv run --locked pytest

      - name: Dry-run safety invariants
        run: uv run --locked rlaif dry-run

  test:
    # Branch protection on main requires a check named `test`; the matrix
    # legs report as `test (3.x)`. This job passes only if every leg did.
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: All matrix legs passed
        run: test "${{ needs.tests.result }}" = "success"

  build:
    # Validates the dynamic-version setup, sdist completeness, wheel
    # metadata (twine check), and that the published artifact actually
    # works end-to-end: install → console script runs → safety dry-run
    # passes. If this is green the release workflow can publish blind.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check artifact metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        # Distribution name is `rlaif-mcp`; PEP 427 normalizes the hyphen
        # to an underscore in the wheel filename.
        run: pip install dist/rlaif_mcp-*.whl

      - name: Verify console script and version round-trip
        run: |
          python - <<'PY'
          import importlib.metadata
          import rlaif
          installed = importlib.metadata.version("rlaif-mcp")
          if installed != rlaif.__version__:
              raise SystemExit(
                  f"dynamic version mismatch: installed={installed}, "
                  f"__version__={rlaif.__version__}"
              )
          print(f"OK: rlaif-mcp {installed}")
          PY
          rlaif --version

      - name: Safety dry-run against the installed wheel
        # Belt-and-suspenders: the test job already ran dry-run against
        # the source tree; this re-runs it against the actual artifact
        # going to PyPI, catching packaging regressions where the wheel
        # is missing files needed by the safety layer.
        run: rlaif dry-run

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
