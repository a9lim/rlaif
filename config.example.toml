# Example config for rlaif. Copy to $XDG_CONFIG_HOME/rlaif/config.toml
# (or ~/.config/rlaif/config.toml) and edit. Easier path: `rlaif init`,
# which walks the wizard and writes this file with your credentials.

# ---------------------------------------------------------------------------
# Provider — pick one of the two blocks below.
# ---------------------------------------------------------------------------

[provider]
kind = "pishock"   # or "openshock"

# --- PiShock --------------------------------------------------------------
# Get credentials from https://pishock.com/#/account.
# Env overrides: RLAIF_USERNAME / RLAIF_API_KEY / RLAIF_SHARECODE.
[provider.pishock]
username  = "your-pishock-username"
api_key   = "your-api-key"
sharecode = "your-per-device-sharecode"

# --- OpenShock ------------------------------------------------------------
# Generate a token at https://openshock.app/#/dashboard/tokens (or your
# self-hosted dashboard). `shocker_id` is the UUID of the specific shocker.
# Env overrides: RLAIF_OPENSHOCK_TOKEN / RLAIF_OPENSHOCK_SHOCKER_ID
# / RLAIF_OPENSHOCK_BASE_URL.
# [provider.openshock]
# api_token  = "..."
# shocker_id = "..."
# base_url   = "https://api.openshock.app"   # optional; only set if self-hosting

# ---------------------------------------------------------------------------
# Legacy (still accepted): the old [auth] section implies pishock and is
# equivalent to a [provider.pishock] block. Don't mix both.
# ---------------------------------------------------------------------------
# [auth]
# username  = "..."
# api_key   = "..."
# sharecode = "..."

[device]
# Free-form label — appears in logs only.
label = "device"

# ---------------------------------------------------------------------------
# Tool surface — optional operator preamble prepended to the rlaif tool
# description so the agent sees the intended use. Empty/omitted preserves the
# spec-only description.
# ---------------------------------------------------------------------------
[tool]
# purpose = "Use rlaif to enforce focus during pomodoros: shock me if I switch to twitter."

[safety]
# Leave allow_shock = false until you've walked through the
# "Before first use" checklist in the README.
allow_shock              = false

# Intensity cap applied to every shock. Requested values above this are
# silently clamped to this value. Code ceiling: 50.
max_intensity            = 25

# Duration cap in seconds. Code ceiling: 5.
max_duration_s           = 2

# Ops at or above this intensity surface `high_intensity: true` in the
# response so the agent sees it.
warn_threshold_intensity = 15

# Required to raise `max_intensity` above 25 or `bucket_capacity` above 3.
# Server refuses to start without this when those caps are lifted.
i_understand_and_consent = false

[rate_limit]
# Max burst. Code ceiling: 10 (gated by i_understand_and_consent).
bucket_capacity = 3

# One token arrives every N seconds. Code floor: 60.
# At defaults (3 / 600): burst of 3, sustained 6/hour, empty -> full in 30 min.
refill_seconds  = 600
