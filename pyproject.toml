[project]
name = "rlaif"
version = "1.0.0"
description = "MCP server exposing a rate-limited PiShock shock tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "a9lim@protonmail.com" }]
keywords = ["mcp", "pishock", "model-context-protocol", "claude", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # upstream PyPI name is `pishock`, not `python-pishock`. pin for reproducibility.
    "pishock==1.2.1",
    "mcp>=1.2.0",
    "structlog>=24.1.0",
]

[project.urls]
Homepage = "https://github.com/a9lim/rlaif"
Issues = "https://github.com/a9lim/rlaif/issues"
Source = "https://github.com/a9lim/rlaif"
Security = "https://github.com/a9lim/rlaif/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.350",
]

[project.scripts]
rlaif = "rlaif.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlaif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
strict = ["src/rlaif"]
pythonVersion = "3.11"
