[project]
name = "rlaif"
version = "0.1.0"
description = "MCP server exposing a rate-limited PiShock shock tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "a9lim", email = "a9lim@protonmail.com" }]
dependencies = [
    # upstream PyPI name is `pishock`, not `python-pishock`. pin for reproducibility.
    "pishock==1.2.1",
    "mcp>=1.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.350",
]

[project.scripts]
rlaif = "rlaif.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlaif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src/rlaif"]
pythonVersion = "3.11"
