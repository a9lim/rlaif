[project]
# Distribution name on PyPI is `rlaif-mcp` (the bare `rlaif` name is taken;
# transfer request pending upstream). The import name and console-script
# stay `rlaif` — `pip install rlaif-mcp` then `import rlaif` / `rlaif ...`.
name = "rlaif-mcp"
dynamic = ["version"]
description = "Single-user MCP server with negative and positive feedback channels"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
keywords = ["mcp", "pishock", "openshock", "buttplug", "intiface", "model-context-protocol", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    # mcp 2.x is the MCPServer / 2026-07-28-protocol line; 3.x will break it.
    "mcp>=2.3,<3",
    "structlog>=24.1.0",
    # httpx2: the PiShock (api.pishock.com) and OpenShock (api.openshock.app
    # or a self-hosted backend) providers speak REST over it. mcp 2.x
    # already depends on it, so both share one HTTP stack. See
    # src/rlaif/providers/pishock.py and openshock.py.
    "httpx2>=2.10",
    # tomlkit + ruamel.yaml: round-trip parsers used by `rlaif install` to
    # auto-write into codex's TOML and hermes's YAML configs without
    # clobbering user comments or formatting. See src/rlaif/installer.py.
    "tomlkit>=0.14.0",
    "ruamel-yaml>=0.19.1",
    # buttplug: speaks the buttplug.io protocol over WebSocket to an
    # Intiface Central instance for the positive (vibration) channel.
    # See src/rlaif/rewards/intiface.py.
    "buttplug>=1.0.0",
]

# URL labels here are the ones PyPI's sidebar specifically renders with
# icons (Source, Issues, Changelog, Documentation, Funding); other labels
# render as plain text links.
[project.urls]
Homepage      = "https://github.com/a9lim/rlaif"
Source        = "https://github.com/a9lim/rlaif"
Issues        = "https://github.com/a9lim/rlaif/issues"
Changelog     = "https://github.com/a9lim/rlaif/releases"
Documentation = "https://github.com/a9lim/rlaif#readme"
Security      = "https://github.com/a9lim/rlaif/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.409",
    "ruff>=0.6.9",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
rlaif = "rlaif.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth: ``__version__`` in src/rlaif/__init__.py.
# Hatchling AST-reads the literal — no module import at build time.
# The ``build`` job in .github/workflows/ci.yml is the validation gate.
[tool.hatch.version]
path = "src/rlaif/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rlaif"]

# Hatchling's sdist defaults only ship pyproject + README + LICENSE + the
# package tree. Tests and the supplemental project paperwork
# (CONTRIBUTING, SECURITY) ride along so the sdist is self-contained
# enough to run the suite from a tarball.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/config.example.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
strict = ["src/rlaif"]
pythonVersion = "3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E (pycodestyle errors), F (pyflakes), W (pycodestyle warnings), I (isort),
# UP (pyupgrade), B (flake8-bugbear) — the bug-finders that don't fight
# legitimate style. Notably skipping ANN/D — not pursuing exhaustive
# annotations on tests or docstring coverage on every helper.
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (line too long): some safety-sensitive comments and refusal-reason
# strings are deliberately long. Pyright + ruff format catch the cases
# that matter.
ignore = ["E501"]
